<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="HealthGuardian AI preventive health workspace" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HealthGuardian" />
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:title" content="HealthGuardian AI" />
    <meta property="og:description" content="Preventive health, private and practical." />
    <meta property="og:image" content="/logo-mark-1024.png" />
    <title>HealthGuardian AI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0b0f19;
          color: #f8fafc;
          font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;
          padding: 24px;
          box-sizing: border-box;
        "
      >
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 320px;
            text-align: center;
          "
        >
          <div
            style="
              width: 64px;
              height: 64px;
              border-radius: 18px;
              background: linear-gradient(135deg, #059669, #0284c7);
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.4);
              margin-bottom: 20px;
            "
          >
            <svg
              width="34"
              height="34"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
              />
            </svg>
          </div>
          <h1
            style="
              font-size: 20px;
              font-weight: 700;
              letter-spacing: -0.02em;
              margin: 0 0 6px;
              color: #ffffff;
            "
          >
            HealthGuardian AI
          </h1>
          <p style="font-size: 12px; color: #94a3b8; margin: 0 0 28px; letter-spacing: 0.02em">
            Preventive Health Workspace
          </p>
          <div
            style="
              width: 180px;
              height: 4px;
              background: #1e293b;
              border-radius: 999px;
              overflow: hidden;
              position: relative;
            "
          >
            <div
              style="
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 40%;
                background: linear-gradient(90deg, #10b981, #38bdf8);
                border-radius: 999px;
                animation: hg-boot 1.4s infinite ease-in-out;
              "
            ></div>
          </div>
          <p style="font-size: 11px; color: #64748b; margin-top: 14px; font-weight: 500">
            Starting application...
          </p>
        </div>
      </div>
      <style>
        @keyframes hg-boot {
          0% {
            left: -40%;
            width: 40%;
          }
          50% {
            left: 30%;
            width: 50%;
          }
          100% {
            left: 100%;
            width: 40%;
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
